name: Build workspace
on:
  workflow_call:
    inputs:
      elide-version:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Elide
        uses: elide-dev/setup-elide@10fbf30cebffd3538c428369950dc2094137f02b # v4.2.0
        with:
          version: ${{ inputs.elide-version }}
          channel: release
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            tests/consumer/pom.xml
            *-plugin/elide.pkl
            maven-plugin/src/main/java/**/*.java
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.5.1'
      - run: elide build
      - name: Test generator with coverage
        working-directory: doclet
        run: elide test --coverage --reporter=junit
      - name: Report generator coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          flags: generator
          files: doclet/.dev/reports/coverage/jvm/jvm-test/jvm-test.xml
      - name: Report generator test results
        if: ${{ !cancelled() && hashFiles('doclet/.dev/reports/tests/jvm/test/*.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          disable_search: true
          fail_ci_if_error: true
          report_type: test_results
          flags: generator
          files: doclet/.dev/reports/tests/jvm/test/TEST-dev.elide.doclet.ElideDocletTest.xml
      - name: Standalone Javadoc site
        run: PATH="$JAVA_HOME/bin:$PATH" scripts/smoke-test
      - name: Site size budget
        run: |
          PATH="$JAVA_HOME/bin:$PATH" scripts/build-samples
          scripts/check-size $(for theme in samples/themes/*.json; do echo ".dev/pages/$(basename "$theme" .json)"; done)
      - run: elide publish --dry-run
      - name: Build shared Java and Kotlin catalog
        run: PATH="$JAVA_HOME/bin:$PATH" scripts/build-shared-sample
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Lighthouse, Good CSS and agent-readiness gates
        run: |
          npm ci --prefix samples/browser --ignore-scripts
          node samples/browser/quality.mjs
      - name: Save quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: .dev/quality
      - name: Gradle plugin end-to-end
        run: PATH="$JAVA_HOME/bin:$PATH" scripts/smoke-test-plugins gradle
      - name: Maven plugin end-to-end
        run: DOCLET_TEST_M2="$HOME/.m2/repository" PATH="$JAVA_HOME/bin:$PATH" scripts/smoke-test-plugins maven
      - run: |
          mkdir dist
          for member in doclet gradle-plugin maven-plugin dokka-plugin; do
            find "$member/.dev/staging/publish/maven" -type f \( -name '*.pom' -o -name '*.jar' \) -exec cp {} dist/ \;
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-artifacts
          path: dist/
          if-no-files-found: error
