name: Build JAR
on:
  workflow_call:
    inputs:
      elide-version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Elide
        uses: elide-dev/setup-elide@10fbf30cebffd3538c428369950dc2094137f02b # v4.2.0
        with:
          version: ${{ inputs.elide-version }}
          channel: release
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: elide build
      - name: Smoke test on JDK 17
        run: PATH="$JAVA_HOME/bin:$PATH" scripts/smoke-test
      - run: elide publish --dry-run
      - run: |
          mkdir dist
          cp .dev/staging/publish/maven/dev/elide/elide-doclet/*/*.{jar,pom} dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-artifacts
          path: dist/
          if-no-files-found: error
