name: Theme gallery
on:
  push:
    branches: [main]
    paths: ['samples/**', 'scripts/build-samples', 'scripts/build-shared-sample', 'scripts/smoke-test-dokka', 'dokka-plugin/**', 'tests/dokka/**', 'scripts/check-size', 'scripts/check-catalog.mjs', 'doclet/**', 'elide.pkl', 'mise.toml', '.github/workflows/on.pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: theme-gallery-pages
  cancel-in-progress: false
jobs:
  build:
    name: Render samples
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain version
        id: tools
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("mise.toml", "rb"))["tools"]["github:elide-dev/elide"])' >> "$GITHUB_OUTPUT"
      - uses: elide-dev/setup-elide@10fbf30cebffd3538c428369950dc2094137f02b # v4.2.0
        with:
          version: ${{ steps.tools.outputs.version }}
          channel: release
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - run: PATH="$JAVA_HOME/bin:$PATH" scripts/build-samples
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.5.1'
      - run: PATH="$JAVA_HOME/bin:$PATH" scripts/build-shared-sample
      - name: Check the size budget
        run: scripts/check-size $(for theme in samples/themes/*.json; do echo ".dev/pages/$(basename "$theme" .json)"; done)
      - name: Check gallery interactions in Chrome
        run: |
          npm ci --prefix samples/browser --ignore-scripts
          python3 -m http.server 8787 --bind 127.0.0.1 --directory .dev/pages &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused --silent --fail http://127.0.0.1:8787/preview.html -o /dev/null
          node samples/browser/check.mjs http://127.0.0.1:8787/
          node scripts/check-catalog.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .dev/pages
  deploy:
    name: Deploy gallery
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
