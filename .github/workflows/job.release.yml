name: GitHub Release
on: workflow_call
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify release at this commit, including on retry
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -1)
          if [[ -n "$tag" ]]; then
            gh release view "$tag" >/dev/null
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.publish.outputs.tag != ''
        with:
          name: maven-artifacts
          path: dist
      - name: Publish tested Maven artifacts to R2
        if: steps.publish.outputs.tag != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: scripts/publish-maven "${TAG#v}" dist
      - name: Attach published artifacts to the release
        if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: gh release upload "$TAG" dist/*.jar dist/*.pom --clobber
