name: GitHub Release
on: workflow_call
permissions:
  contents: write
  packages: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.release_created == 'true'
        with:
          name: maven-artifacts
          path: dist
      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.jar dist/*.pom --repo "$GITHUB_REPOSITORY" --clobber
      - name: Set up Maven publication
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
      - name: Publish tested artifacts to GitHub Packages
        if: steps.release.outputs.release_created == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for pom in dist/*.pom; do
            mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
              -DrepositoryId=github -Durl="https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
              -DpomFile="$pom" -Dfile="${pom%.pom}.jar"
          done
