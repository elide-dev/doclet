'area: doclet':
  - changed-files:
      - any-glob-to-any-file: ['doclet/**', 'gradle-plugin/**', 'maven-plugin/**']
'area: tooling':
  - changed-files:
      - any-glob-to-any-file: ['scripts/**', '*.pkl', 'mise.toml']
'area: ci':
  - changed-files:
      - any-glob-to-any-file: '.github/**'
'area: release':
  - changed-files:
      - any-glob-to-any-file: ['*release-please*.json', '.github/workflows/job.release.yml']
documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'
